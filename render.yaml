# Blueprint do Render: serviço web (Dockerfile) + PostgreSQL gerenciado, na mesma região.
# A URL de conexão do banco é ligada pelo próprio Render (fromDatabase): nenhuma credencial fica no repositório
# nem é copiada à mão. O banco só aceita conexões da rede interna do Render (ipAllowList vazio).
databases:
  - name: agenda-village-pet-db
    plan: free
    region: ohio
    databaseName: agenda_village_pet
    user: village
    postgresMajorVersion: "16"
    ipAllowList: []

services:
  - type: web
    name: agenda-village-pet
    runtime: docker
    plan: free
    region: ohio
    healthCheckPath: /api/saude
    autoDeploy: true
    envVars:
      - key: AMBIENTE
        value: producao
      - key: DATABASE_URL
        fromDatabase:
          name: agenda-village-pet-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: SEED_DEMO
        value: "1"
      - key: TZ
        value: America/Sao_Paulo
