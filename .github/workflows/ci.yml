name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  testes:
    name: Lint, testes e cobertura
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check app tests

      - name: Testes unitários e de integração com cobertura
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=80

      - name: Auditoria de dependências (pip-audit)
        run: pip-audit -r requirements.txt
        continue-on-error: true

      - name: Publicar relatório de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: cobertura
          path: coverage.xml
