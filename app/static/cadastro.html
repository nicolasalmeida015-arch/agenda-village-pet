<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Criar conta – Agenda Village Pet</title><link rel="icon" href="data:,">
<link rel="stylesheet" href="/css/app.css">
<script src="/js/acessibilidade.js"></script></head>
<body>
<header><div class="marca">🐾 Agenda Village Pet</div><div class="unid">Criar conta de tutor</div></header>
<main>
  <h1>Criar conta</h1>
  <form id="form" class="card" novalidate>
    <div class="campo"><label for="nome">Seu nome</label><input id="nome" autocomplete="name" required maxlength="100"></div>
    <div class="campo"><label for="email">E-mail</label><input id="email" type="email" autocomplete="email" required></div>
    <div class="campo"><label for="tel">WhatsApp (com DDD)</label><input id="tel" type="tel" inputmode="tel" placeholder="11 91234-5678" required></div>
    <div class="campo"><label for="senha">Senha (mínimo 10 caracteres)</label><input id="senha" type="password" autocomplete="new-password" minlength="10" required></div>
    <label style="display:flex;gap:10px;align-items:flex-start;font-weight:400;min-height:48px">
      <input id="lgpd" type="checkbox" style="width:24px;min-height:24px">
      <span>Li e aceito que meus dados (nome, e-mail e WhatsApp) sejam usados apenas para agendamentos e lembretes da Village Pet.</span></label>
    <p id="erro" class="erro oculto" role="alert" tabindex="-1"></p>
    <button class="btn prim" type="submit">Criar conta</button>
  </form>
  <a class="btn" href="/">Já tenho conta</a>
</main>
<script src="/js/api.js"></script>
<script src="/js/cadastro.js"></script>
</body></html>
