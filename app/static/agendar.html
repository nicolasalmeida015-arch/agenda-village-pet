<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agendar – Agenda Village Pet</title><link rel="icon" href="data:,">
<link rel="stylesheet" href="/css/app.css">
<script src="/js/acessibilidade.js"></script></head>
<body>
<header><div class="marca">Agendar banho e tosa</div><div class="unid">Village Pet – BR-116</div></header>
<main>
  <section id="passo-escolha">
    <div class="campo"><label for="pet">Pet</label><select id="pet"></select></div>
    <div class="campo" style="margin-top:10px"><label for="servico">Serviço</label><select id="servico"></select></div>
    <div class="campo" style="margin-top:10px"><label for="dia">Data</label><input id="dia" type="date"></div>
    <h2 style="margin-top:14px">Horário <span class="muted">(escolha um horário livre)</span></h2>
    <div id="horas" class="horas" role="group" aria-label="Horários livres"></div>
    <p id="sem-horario" class="muted oculto">Não há horários livres nesta data. Escolha outro dia.</p>
    <p id="resumo" class="card oculto" aria-live="polite"></p>
    <p id="erro" class="erro oculto" role="alert" tabindex="-1"></p>
    <button id="confirmar" class="btn prim" type="button" disabled>Confirmar agendamento</button>
  </section>

  <section id="passo-resultado" class="oculto">
    <div class="ok" role="status" aria-live="polite"><h1>✅ Agendado!</h1><p id="detalhe"></p>
      <p class="muted">🔔 Você receberá um lembrete na véspera para confirmar.</p></div>
    <a class="btn prim" href="/">Voltar ao início</a>
  </section>

  <section id="conflito" class="alerta oculto" role="alert">
    <strong>⚠️ <span id="msg-conflito"></span></strong>
    <div id="alternativas" class="horas" style="margin-top:8px"></div>
  </section>

  <section id="meus" class="card"><h2>Meus agendamentos</h2>
    <p id="aviso-meus" class="ok oculto" role="status" aria-live="polite"></p>
    <ul id="lista-ags" style="padding-left:18px"></ul></section>
  <a id="voltar-rodape" class="btn" href="/">Voltar ao início</a>
</main>
<script src="/js/api.js"></script>
<script src="/js/agendar.js"></script>
</body></html>
